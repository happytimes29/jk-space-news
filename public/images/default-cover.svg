<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0070F3" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#000000"/>

  <!-- Grid pattern -->
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glow -->
  <ellipse cx="600" cy="337" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="556" y="287" width="88" height="88" rx="12" fill="#0070F3"/>
  <text x="600" y="348" font-family="system-ui" font-size="40" font-weight="900" fill="white" text-anchor="middle">⚡</text>

  <!-- Brand name -->
  <text x="600" y="415" font-family="system-ui" font-size="18" font-weight="700" fill="#EDEDED" text-anchor="middle" letter-spacing="2">JK SPACE NEWS</text>
  <text x="600" y="440" font-family="system-ui" font-size="12" fill="#888888" text-anchor="middle">AI &amp; 科技情報站</text>

  <!-- Corner decorations -->
  <line x1="40" y1="40" x2="80" y2="40" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="40" x2="40" y2="80" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="1160" y1="40" x2="1120" y2="40" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="1160" y1="40" x2="1160" y2="80" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="635" x2="80" y2="635" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="635" x2="40" y2="595" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="1160" y1="635" x2="1120" y2="635" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
  <line x1="1160" y1="635" x2="1160" y2="595" stroke="#0070F3" stroke-width="1" opacity="0.5"/>
</svg>
